version: v2
plugins:
  - local: protoc-gen-go
    out: api/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: api/proto
    opt: paths=source_relative
  - local: protoc-gen-es
    out: web/src/generated
    opt: target=ts,import_extension=.ts
  - local: protoc-gen-connect-es
    out: web/src/generated
    opt: target=ts,import_extension=.ts