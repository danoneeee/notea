syntax = "proto3";

package teanotes.v1;

import "google/protobuf/timestamp.proto";

option go_package = "notea/api/proto/teanotes/v1;teanotesv1";


message DescriptorCategory {
  string id = 1;
  string name = 2;
  string color_hex = 3;
  repeated DescriptorSegment segments = 4;
}

message DescriptorSegment {
  string id = 1;
  string name = 2;
  repeated Descriptor descriptors = 3;
}

message Descriptor {
  string id = 1;
  string name = 2;
  DescriptorType type = 3;
  string color_hex = 4;
}

enum DescriptorType {
  DESCRIPTOR_TYPE_UNSPECIFIED = 0;
  DESCRIPTOR_TYPE_AROMA = 1;
  DESCRIPTOR_TYPE_TASTE = 2;
  DESCRIPTOR_TYPE_BOTH = 3;
}


// Сервис чайных заметок: каталог чаёв и сессии заваривания.
service TeaNotesService {
  // Создать сессию заваривания.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Получить одну сессию по id.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // Список сессий (позже добавим фильтры по user_id, tea_id).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Справочник чаёв: сорт + провинция.
  rpc ListTeas(ListTeasRequest) returns (ListTeasResponse);
  rpc ListDescriptorCategories(ListDescriptorCategoriesRequest) returns (ListDescriptorCategoriesResponse);
  // Журнал дегустаций (модель как NoteRecord во фронте). Требует Authorization: Bearer <JWT>.
  rpc UpsertTeaNote(UpsertTeaNoteRequest) returns (UpsertTeaNoteResponse);
  rpc GetTeaNote(GetTeaNoteRequest) returns (GetTeaNoteResponse);
  rpc ListTeaNotes(ListTeaNotesRequest) returns (ListTeaNotesResponse);
  rpc DeleteTeaNote(DeleteTeaNoteRequest) returns (DeleteTeaNoteResponse);
}

// ---- Справочник чаёв ----

message Tea {
  string id = 1;
  string name = 2;      // сорт, например "Шу Пуэр"
  string province = 3;  // провинция, например "Юньнань"
  string variant = 4;   // опционально: "с жасмином", пусто если нет
}

message ListTeasRequest {
  // пока без фильтров
}

message ListTeasResponse {
  repeated Tea teas = 1;
}

message ListDescriptorCategoriesRequest {

}

message ListDescriptorCategoriesResponse {
  repeated DescriptorCategory categories = 1;
}

// ---- Сессия заваривания ----

message BrewingParams {
  int32 temperature_c = 1;       // температура воды, °C
  int32 steep_sec = 2;           // время пролива, секунды
  double leaves_g_per_100ml = 3; // грамм листа на 100 мл воды
}

// Один дескриптор с интенсивностью (фиксированный список, id от 1 до N).
message DescriptorScore {
  string descriptor_id = 1; // например "мед", "цветочный" — id из справочника
  int32 intensity = 2;      // 1–5
}

message Session {
  string id = 1;
  string tea_id = 2;
  string user_id = 3;  // пока строка, позже связь с auth
  BrewingParams params = 4;
  repeated DescriptorScore aroma_descriptors = 5;
  repeated DescriptorScore taste_descriptors = 6;
  string notes = 7;    // произвольные заметки текстом
  google.protobuf.Timestamp session_at = 8;  // когда было чаепитие
}

message CreateSessionRequest {
  string tea_id = 1;
  string user_id = 2;
  BrewingParams params = 3;
  repeated DescriptorScore aroma_descriptors = 4;
  repeated DescriptorScore taste_descriptors = 5;
  string notes = 6;
  google.protobuf.Timestamp session_at = 7;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  // позже: user_id, tea_id, limit, offset
  int32 limit = 1;
  int32 offset = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// ---- Журнал заметок (веб-приложение) ----

message NoteRatingsMsg {
  int32 aroma = 1;
  int32 taste = 2;
  int32 aftertaste = 3;
  int32 balance = 4;
}

message TeaNote {
  string id = 1;
  optional string session_title = 2;
  string tea_name = 3;
  string tea_type = 4;
  string region = 5;
  optional string origin_detail = 6;
  optional string cultivar = 7;
  optional string source = 8;
  optional string processing_style = 9;
  optional string harvest_season = 10;
  optional int32 harvest_year = 11;
  repeated string skipped_fields = 12;
  string brewing_mode = 13;
  string brewing_method = 14;
  optional string water_source = 15;
  optional string setup_id = 16;
  string setup_summary = 17;
  optional double leaf_grams = 18;
  optional int32 water_temp = 19;
  optional int32 water_volume_ml = 20;
  optional int32 rinse_count = 21;
  optional int32 infusions_count = 22;
  optional double time_value = 23;
  string time_unit = 24;
  repeated string descriptors = 25;
  optional string liquor_color = 26;
  optional string mouthfeel = 27;
  optional string energy_effect = 28;
  string free_text = 29;
  NoteRatingsMsg ratings = 30;
  google.protobuf.Timestamp updated_at = 31;
  optional string note_color = 32;
}

message UpsertTeaNoteRequest {
  TeaNote note = 1;
}

message UpsertTeaNoteResponse {
  TeaNote note = 1;
}

message GetTeaNoteRequest {
  string note_id = 1;
}

message GetTeaNoteResponse {
  TeaNote note = 1;
}

message ListTeaNotesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListTeaNotesResponse {
  repeated TeaNote notes = 1;
}

message DeleteTeaNoteRequest {
  string note_id = 1;
}

message DeleteTeaNoteResponse {}
